# deploy-cf-pages.yml — Cloudflare Pages 部署（T-P4-01 / T-P4-03，v1.2 直传）
#
# 触发：默认仅手动 workflow_dispatch。自动触发段（push: master + 代码 paths）已按
#   ARCHITECTURE §6.1.1 方案 B 整块注释，需要时取消注释 4 行 push 段即可启用；
#   job 上的 `if` 守卫是双保险。deploy 分支数据提交不触发本工作流（无循环）。
#
# 部署方式：构建产物 dist → cloudflare/wrangler-action 直传 Cloudflare Pages（Direct Upload）。
#   直传 ≠ 构建 → 不消耗 CF 500 builds/月（ARCHITECTURE §7.6）。
#
# ⚠️ 安全红线（ARCHITECTURE §7.6.3）：严禁使用 cloudflare 旧版 Pages Action（CVE-2026-11325 未修复 RCE，
#   仓库 2026-09-18 删除）。必须用 cloudflare/wrangler-action。下面已固定到已核实的 full commit SHA。
#
# wrangler-action@v3 真实 full commit SHA（curl api.github.com 核实）：9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
#   生产环境固定 SHA 而非浮动 tag，防止 tag 被改写/投毒（供应链安全）。
#
# secrets（源自 GitHub Secrets，YAML 中不写任何明文）：
#   CLOUDFLARE_API_TOKEN   Account › Cloudflare Pages › Edit（最小权限）
#   CLOUDFLARE_ACCOUNT_ID  CF 账户 ID
#   GITHUB_TOKEN           内置，可选：在 GitHub 生成 Deployment 记录
# 权限：contents: read, deployments: write
name: deploy-cf-pages

on:
  # ⛔ 自动触发默认禁用（与 GH Pages 一致：先手动，稳定后再开）。
  # push:
  #   branches: [master]
  #   paths:
  #     - 'src/**'
  #     - 'config/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'index.html'
  #     - 'vite.config.ts'
  workflow_dispatch:            # ✅ 始终保留，保证手动可触发且文件合法
    inputs:
      target:
        description: '部署目标'
        type: choice
        options: [cloudflare-pages]
        default: cloudflare-pages

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch'     # 🛡 非手动不跑（开自动后删除本行）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        # 已固定到核实过的 full commit SHA（非浮动 tag）
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # Account › Cloudflare Pages › Edit
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rss-radar
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}        # 可选：在 GH 生成 Deployment 记录
